name: Bug report
description: Report a reproducible defect or regression.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for making the report reproducible and evidence-based.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe observed behavior and why it is incorrect.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include the smallest commands, inputs, or code needed to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, container/runtime details, and relevant configuration.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or evidence
      render: shell
